name: Sync Fork
on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:  # manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/markmdev/bake-off.git
          git fetch upstream
          git merge upstream/main --no-edit
          git push
